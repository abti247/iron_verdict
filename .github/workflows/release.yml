name: Release

# Last link of the release chain in main.yml, after green E2E tests on Railway
# staging. Behind the approval of environment Release: tags the commit
# vX.Y.Z, promotes the image main.yml already built and tested for it
# (sha-<commit>) to vX.Y.Z without rebuilding, then creates the GitHub release
# from the CHANGELOG section. Deploying to production stays manual: point the
# Railway service at the new tag (docs/release.md).
#
# Why no tag trigger: every release must pass staging. And a tag pushed with
# GITHUB_TOKEN starts no workflow, so this runs inside the chain instead.
on:
  workflow_call:
    inputs:
      version:
        description: Version from pyproject.toml (X.Y.Z)
        type: string
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/abti247/iron_verdict
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Release
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not of the form X.Y.Z"
            exit 1
          fi
          PYPROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml has version $PYPROJECT_VERSION, expected $VERSION"
            exit 1
          fi

      - name: Build release notes
        run: |
          python3 scripts/changelog_section.py "$VERSION" > release-notes.md
          printf '\n## Docker\n\ndocker pull %s:%s\n' "$IMAGE_REPO" "$TAG" >> release-notes.md
          cat release-notes.md

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # retag_image.sh copies the manifest bytes unchanged, so the digest stays
      # identical; imagetools create would wrap a single-platform manifest in
      # a new manifest list with another digest. Re-running is safe: the same
      # digest is tagged again.
      - name: Tag the tested image as v${{ inputs.version }} (no rebuild)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE="$IMAGE_REPO:sha-${GITHUB_SHA::7}"
          if ! SOURCE_DIGEST="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Manifest}}' | jq -re .digest)"; then
            echo "::error::$SOURCE not found"
            exit 1
          fi
          scripts/retag_image.sh "$IMAGE_REPO" "$SOURCE_DIGEST" "$TAG"
          RELEASE_DIGEST="$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" --format '{{json .Manifest}}' | jq -re .digest)"
          if [ "$RELEASE_DIGEST" != "$SOURCE_DIGEST" ]; then
            echo "::error::$TAG has digest $RELEASE_DIGEST, expected $SOURCE_DIGEST"
            exit 1
          fi
          {
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`sha-${GITHUB_SHA::7}\` | \`$SOURCE_DIGEST\` |"
            echo "| \`$TAG\` | \`$RELEASE_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Annotated tag, like the tags pushed by hand before. If a re-run finds
      # the tag already on this commit (the release step failed last time),
      # it keeps it; on another commit it stops.
      - name: Create tag v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null)"; then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on $EXISTING, not on $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already on $GITHUB_SHA (re-run)"
            exit 0
          fi
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$TAG_OBJECT" > /dev/null
          echo "Tagged \`$GITHUB_SHA\` as \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
