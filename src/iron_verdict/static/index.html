<!DOCTYPE html>
<html lang="en" class="booting">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Verdict — Powerlifting Judging</title>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/display-contrast.css">
    <link rel="stylesheet" href="/static/css/display-layout.css">
    <link rel="stylesheet" href="/static/css/boot.css">
    <script type="module" src="/static/js/init.js"></script>
    <script defer src="https://umami-production-ca4a.up.railway.app/script.js" data-website-id="aca70c7a-7634-4ae5-bffa-cc83d8764bd0"></script>
    <link rel="preload" as="script" href="/static/vendor/alpinejs-3.14.1.min.js">
    <script src="/static/vendor/qrcodejs-1.0.0.min.js"></script>
</head>
<body x-data :class="{ 'display-mode': $store.session.role === 'display' && $store.nav.screen === 'display' }">

    <!-- Boot screen: the only thing visible until Alpine has started (see boot.css).
         Plain markup without Alpine or i18n, because it must work without them. -->
    <div class="boot-screen">
        <div class="boot-loading" role="status">
            <div class="boot-spinner"></div>
            <p>Laden … / Loading …</p>
        </div>
        <div class="boot-fallback" role="alert">
            <p>App konnte nicht geladen werden – Seite neu laden</p>
            <p>App could not be loaded – reload the page</p>
            <a class="boot-reload" href="">Neu laden / Reload</a>
        </div>
    </div>

    <!-- Demo Intro Screen -->
    <template x-if="$store.nav.screen === 'demo-intro'">
    <div class="landing-wrap" data-testid="demo-intro-screen" x-data="demoIntroScreen">
        <div class="landing-panel cut-corner landing-panel--demo">

            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="brand-verdict-sub" x-text="t('demo.guideTitle')"></div>

            <p class="demo-guide-text">
                <span x-text="t('demo.introBeforeLink')"></span><a class="demo-guide-link" :href="t('demo.rulebookUrl')" target="_blank" rel="noopener noreferrer" x-text="t('demo.rulebookLink')"></a><span x-text="t('demo.introAfterLink')"></span>
            </p>

            <div class="demo-guide-heading" x-text="t('demo.whyTitle')"></div>
            <ul class="demo-guide-list">
                <li><span class="text-em" x-text="t('demo.athletesTerm')"></span> — <span x-text="t('demo.athletes')"></span></li>
                <li><span class="text-em" x-text="t('demo.audienceTerm')"></span> — <span x-text="t('demo.audience')"></span></li>
                <li><span class="text-em" x-text="t('demo.judgesTerm')"></span> — <span x-text="t('demo.judges')"></span></li>
                <li><span class="text-em" x-text="t('demo.juryTerm')"></span> — <span x-text="t('demo.jury')"></span></li>
            </ul>

            <div class="demo-guide-heading" x-text="t('demo.setupTitle')"></div>
            <ol class="demo-guide-list">
                <li x-text="t('demo.setupStep1')"></li>
                <li x-text="t('demo.setupStep2')"></li>
                <li x-text="t('demo.setupStep3')"></li>
            </ol>

            <div class="demo-guide-heading" x-text="t('demo.headControlsTitle')"></div>
            <ul class="demo-guide-list">
                <li x-text="t('demo.showReasonsDesc')"></li>
                <li x-text="t('demo.requireReasonsDesc')"></li>
                <li x-text="t('demo.liftCategoryDesc')"></li>
            </ul>

            <div class="demo-guide-heading" x-text="t('demo.duringTitle')"></div>
            <ol class="demo-guide-list">
                <li x-text="t('demo.duringStep1')"></li>
                <li x-text="t('demo.duringStep2')"></li>
                <li x-text="t('demo.duringStep3')"></li>
                <li x-text="t('demo.duringStep4')"></li>
                <li x-text="t('demo.duringStep5')"></li>
                <li x-text="t('demo.duringStep6')"></li>
            </ol>

            <div x-show="!demoRunning && popupsBlocked === 'none'" class="demo-popup-note" x-text="t('demo.popupNote')"></div>
            <div x-show="popupsBlocked !== 'none'" class="demo-popups-blocked" role="alert" data-testid="demo-popups-blocked"
                 x-text="popupsBlocked === 'all' ? t('demo.popupsBlockedAll') : t('demo.popupsBlockedSome')"></div>

            <div x-show="!demoRunning" class="demo-launch-wrap">
                <button class="btn-blood btn-blood-primary cut-corner-sm" @click="launchDemo()" x-text="t('demo.launchDemo')">
                </button>
            </div>

            <div x-show="demoRunning" class="demo-running-msg" data-testid="demo-running" x-text="t('demo.demoRunning')"></div>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="$store.nav.navigateTo('landing')">
                    &larr; <span x-text="t('demo.backToStart')"></span>
                </button>
            </div>

        </div>
    </div>
    </template>

    <!-- Reconnecting Screen: shown right after a reload while the stored session is restored (reloadRecovery.js) -->
    <template x-if="$store.nav.screen === 'reconnecting'">
    <div class="landing-wrap" data-testid="reconnecting-screen" x-data="reconnectingScreen">
        <div class="landing-panel cut-corner reconnecting-panel" role="status">
            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="boot-spinner"></div>
            <div class="reconnecting-text">
                <span x-text="t('reconnecting.connecting')"></span>
                <span class="reconnecting-code" x-text="$store.session.code"></span>
            </div>
            <button class="btn-blood btn-blood-ghost" @click="cancelReconnect()"
                    x-text="t('reconnecting.cancel')"></button>
        </div>
    </div>
    </template>

    <!-- Landing Screen -->
    <template x-if="$store.nav.screen === 'landing'">
    <div class="landing-wrap" data-testid="landing-screen" x-data="landingScreen">
        <div class="landing-panel cut-corner">
            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="brand-verdict-sub" x-text="t('landing.subtitle')"></div>

            <div class="form-stack">
                <input class="chrome-input" :placeholder="t('landing.placeholder.sessionName')"
                       data-testid="session-name-input" x-model="$store.session.newSessionName" @keyup.enter="createSession()">
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="createSession()" :disabled="!$store.session.newSessionName.trim()"
                        x-text="t('landing.createSession')">
                </button>

                <div class="slash-divider" x-text="t('landing.or')"></div>

                <input class="chrome-input" :placeholder="t('landing.placeholder.sessionCode')"
                       data-testid="join-code-input" x-model="$store.session.joinCode"
                       @input="$store.session.joinError = ''"
                       @keyup.enter="joinExistingSession()">
                <button class="btn-blood btn-blood-secondary cut-corner-sm"
                        @click="joinExistingSession()"
                        :disabled="$store.session.joinCode.trim().length !== 8 || $store.session.joinChecking"
                        x-text="$store.session.joinChecking ? t('landing.checking') : t('landing.joinSession')">
                </button>
                <div class="join-error" x-show="$store.session.joinError" x-cloak x-text="$store.session.joinError"></div>
            </div>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="$store.nav.navigateTo('demo-intro')" x-text="t('landing.startDemo')">
                </button>
            </div>

            <div class="btn-row--sm">
                <button class="btn-blood btn-blood-ghost" @click="$store.nav.navigateTo('contact')" x-text="t('landing.contact')">
                </button>
            </div>

            <div class="app-version">
                __APP_VERSION__
            </div>

            <div class="lang-footer">
                <span class="lang-globe">&#127760;</span>
                <template x-for="(lang, idx) in ['en', 'de']" :key="lang">
                    <span>
                        <span x-show="idx > 0" class="lang-sep">|</span>
                        <span class="lang-option"
                              :class="{ 'lang-active': getLanguage() === lang }"
                              @click="setLanguage(lang)"
                              x-text="t('language.' + lang)"></span>
                    </span>
                </template>
            </div>

            <div class="privacy-footer">
                <span class="privacy-link" @click="$store.nav.navigateTo('privacy')" x-text="t('privacy.link')"></span>
            </div>
        </div>
    </div>
    </template>

    <!-- Contact Screen -->
    <template x-if="$store.nav.screen === 'contact'">
    <div class="landing-wrap" data-testid="contact-screen" x-data="contactScreen">
        <div class="landing-panel cut-corner">
            <div class="brand-iron chrome-text" x-text="t('contact.title')"></div>
            <div class="brand-verdict-sub">Iron Verdict</div>

            <form class="form-stack" @submit.prevent="submitContact()" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="2e92ea27-be19-4996-83c9-0b33fcb63419">
                <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                <div x-show="contactStatus !== 'success'">
                    <div class="form-stack form-stack--no-top">
                        <input class="chrome-input" type="text" name="name" :placeholder="t('contact.name')"
                               x-model="contactName" required>
                        <input class="chrome-input" type="email" name="email" :placeholder="t('contact.email')"
                               x-model="contactEmail">
                        <textarea class="chrome-textarea" name="message" :placeholder="t('contact.message')"
                                  x-model="contactMessage" required></textarea>

                        <button class="btn-blood btn-blood-primary cut-corner-sm"
                                type="submit"
                                :disabled="contactStatus === 'loading' || !contactName.trim() || !contactMessage.trim()"
                                x-text="contactStatus === 'loading' ? t('contact.sending') : t('contact.send')">
                        </button>

                        <div x-show="contactStatus === 'error'" class="contact-error" x-text="t('contact.error')">
                        </div>
                    </div>
                </div>

                <div x-show="contactStatus === 'success'" class="contact-success">
                    <span x-text="t('contact.sent')"></span>
                    <div class="contact-success-sub" x-text="t('contact.sentSub')">
                    </div>
                </div>
            </form>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="$store.nav.navigateTo('landing')">
                    &larr; <span x-text="t('contact.back')"></span>
                </button>
            </div>
        </div>
    </div>
    </template>

    <!-- Privacy Screen -->
    <template x-if="$store.nav.screen === 'privacy'">
    <div class="landing-wrap" data-testid="privacy-screen">
        <div class="landing-panel cut-corner">
            <div class="brand-iron brand-iron--legal chrome-text" x-text="t('privacy.title')"></div>
            <div class="brand-verdict-sub">Iron Verdict</div>

            <h2 class="legal-heading" x-text="t('privacy.privacyHeading')"></h2>
            <ul class="privacy-list">
                <li x-text="t('privacy.serverLogs')"></li>
                <li x-text="t('privacy.session')"></li>
                <li x-text="t('privacy.language')"></li>
                <li x-text="t('privacy.analytics')"></li>
                <li x-text="t('privacy.cookies')"></li>
            </ul>

            <h2 class="legal-heading" x-text="t('privacy.legalHeading')"></h2>
            <div class="legal-notice" data-testid="legal-notice">
                <p>
                    Alexander Becela<br>
                    c/o POSTFLEX PFX-294-418<br>
                    Emsdettener Straße 10<br>
                    48268 Greven
                </p>
                <p x-text="t('privacy.noParcels')"></p>
                <p>
                    <span x-text="t('privacy.email')"></span>:
                    <a href="mailto:iron.verdict.judging@gmail.com">iron.verdict.judging@gmail.com</a>
                </p>
            </div>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="$store.nav.navigateTo('landing')">
                    &larr; <span x-text="t('privacy.back')"></span>
                </button>
            </div>
        </div>
    </div>
    </template>

    <!-- Role Selection Screen -->
    <div class="role-wrap" data-testid="role-select-screen" x-data="roleSelectScreen" x-show="$store.nav.screen === 'role-select'" x-cloak>
        <div class="role-panel cut-corner">
            <div class="role-heading chrome-text" x-text="t('roles.heading')"></div>
            <div class="session-tag">
                <span x-text="t('roles.session')"></span> <span class="code" x-text="$store.session.code"></span>
            </div>

            <div class="role-qr-wrap">
                <div id="qrcode" x-ref="qrcode"></div>
            </div>

            <div class="lang-toggle">
                <template x-for="lang in ['en', 'de']" :key="lang">
                    <button class="lang-toggle-btn"
                            :class="{ active: getLanguage() === lang }"
                            @click="setLanguage(lang)"
                            x-text="lang.toUpperCase()"></button>
                </template>
            </div>

            <div class="role-notice" role="alert" x-show="$store.session.roleTakenOver" x-cloak x-text="roleTakenOverNotice()"></div>

            <div class="role-grid">
                <button class="role-btn cut-corner-sm" @click="joinSession('left_judge')" x-text="t('roles.left')">
                </button>
                <button class="role-btn cut-corner-sm" @click="joinSession('center_judge')" x-text="t('roles.chiefReferee')" style="white-space: pre-line">
                </button>
                <button class="role-btn cut-corner-sm" @click="joinSession('right_judge')" x-text="t('roles.right')">
                </button>
                <button class="role-btn role-display-btn cut-corner-sm" @click="joinSession('display')" x-text="t('roles.display')">
                </button>
            </div>
            <template x-if="$store.session.kind === 'vportal'">
                <div class="vportal-connect-wrap">
                    <button class="vportal-connect-btn cut-corner-sm"
                            :class="{ 'connected': $store.vportal.connected }"
                            @click="$store.vportal.openModal()"
                            x-text="$store.vportal.connected
                                ? (t('vportal.connectedTo') + ' ' + $store.vportal.federationLabel + ' · ' + ($store.vportal.stageName || ''))
                                : t('vportal.connectButton')"></button>
                </div>
            </template>
            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="returnToLanding()">
                    &larr; <span x-text="t('roles.backToStart')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- VPortal Connect Modal -->
    <div class="vportal-modal-backdrop" data-testid="vportal-modal" x-show="$store.vportal.modalOpen" x-cloak @click.self="$store.vportal.modalOpen = false">
        <div class="vportal-modal cut-corner" @click.stop>
            <div class="vportal-modal-title chrome-text" x-text="t('vportal.modalTitle')"></div>

            <!-- Step 1: Federation -->
            <div class="vportal-step-federation" x-show="$store.vportal.modalStep === 'federation'">
                <label class="vportal-label" x-text="t('vportal.federationLabel')"></label>
                <select class="chrome-input" data-testid="vportal-federation-select" x-model="$store.vportal.federation">
                    <option value="BVDK" x-text="t('vportal.federationBvdk')"></option>
                    <option value="OEVK" x-text="t('vportal.federationOevk')"></option>
                    <template x-if="$store.vportal.stagingAvailable">
                        <option value="BVDK_STAGING" x-text="t('vportal.federationBvdkStaging')"></option>
                    </template>
                </select>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.modalStep = 'credentials'">→</button>
                </div>
            </div>

            <!-- Step 2: Credentials -->
            <div class="vportal-step-credentials" x-show="$store.vportal.modalStep === 'credentials'">
                <label class="vportal-label" x-text="t('vportal.usernameLabel')"></label>
                <input class="chrome-input" type="text" data-testid="vportal-identity-input" x-model="$store.vportal.identity" autocomplete="username">
                <label class="vportal-label" x-text="t('vportal.passwordLabel')"></label>
                <input class="chrome-input" type="password" data-testid="vportal-credential-input" x-model="$store.vportal.credential" autocomplete="current-password">
                <div class="vportal-error" x-show="$store.vportal.loginError" x-text="$store.vportal.loginError"></div>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalStep = 'federation'">←</button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.doLogin($store.session.code)" :disabled="!$store.vportal.identity || !$store.vportal.credential" x-text="t('vportal.loginButton')"></button>
                </div>
            </div>

            <!-- Step 3: Stage picker -->
            <div class="vportal-step-stage" x-show="$store.vportal.modalStep === 'stage'">
                <label class="vportal-label" x-text="t('vportal.stageLabel')"></label>
                <select class="chrome-input" data-testid="vportal-stage-select" x-model="$store.vportal.selectedStage" :disabled="$store.vportal.stages.length === 0">
                    <template x-for="stage in $store.vportal.stages" :key="stage.id">
                        <option :value="stage.id" x-text="stage.name"></option>
                    </template>
                </select>
                <div class="vportal-loading" x-show="$store.vportal.stages.length === 0 && !$store.vportal.stageError" x-text="t('vportal.loadingStages')"></div>
                <div class="vportal-error" x-show="$store.vportal.stageError" x-text="$store.vportal.stageError"></div>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.confirmStage($store.session.code)" :disabled="!$store.vportal.selectedStage" x-text="t('vportal.stageSelectButton')"></button>
                </div>
            </div>

            <!-- Step 4: Connected (when re-opened on already-connected session) -->
            <div class="vportal-step-connected" x-show="$store.vportal.modalStep === 'connected'">
                <p>
                    <span x-text="t('vportal.connectedTo')"></span>
                    <strong x-text="$store.vportal.federationLabel"></strong>
                    · <strong x-text="$store.vportal.stageName"></strong>
                </p>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary" @click="$store.vportal.disconnect($store.session.code)" x-text="t('vportal.disconnectButton')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Judge Screen -->
    <div class="judge-wrap" data-testid="judge-screen" x-data="judgeScreen" x-show="$store.nav.screen === 'judge'" x-cloak>
        <div class="judge-bar">
            <div class="judge-role-label" x-text="getRoleDisplayName()"></div>
            <div class="judge-timer" :class="$store.timer.expired && 'expired'" x-text="$store.timer.display"></div>
            <div class="judge-code">
                <span class="conn-dot" :class="$store.session.connectionStatus"></span>
                <span class="conn-label" x-show="$store.session.serverRestarting" x-text="t('connection.serverRestarting')"></span>
                <span class="code-link" @click="returnToRoleSelection()" x-text="$store.session.isDemo ? 'DEMO' : $store.session.code"></span>
            </div>
        </div>

        <div class="vote-grid" x-show="!$store.judge.showingReasonStep" :style="$store.judge.voteLocked ? 'opacity:0.35;pointer-events:none' : ''">
            <button class="vote-btn vote-white cut-corner-sm"
                    :class="$store.judge.selectedVote === 'white' && 'selected'"
                    @click="$store.judge.selectVote('white')" :disabled="$store.judge.voteLocked"
                    x-text="t('judge.colors.white')">
            </button>
            <button class="vote-btn vote-red cut-corner-sm"
                    :class="$store.judge.selectedVote === 'red' && 'selected'"
                    @click="$store.judge.selectVote('red')" :disabled="$store.judge.voteLocked"
                    x-text="t('judge.colors.red')">
            </button>
            <button class="vote-btn vote-blue cut-corner-sm"
                    :class="$store.judge.selectedVote === 'blue' && 'selected'"
                    @click="$store.judge.selectVote('blue')" :disabled="$store.judge.voteLocked"
                    x-text="t('judge.colors.blue')">
            </button>
            <button class="vote-btn vote-yellow cut-corner-sm"
                    :class="$store.judge.selectedVote === 'yellow' && 'selected'"
                    @click="$store.judge.selectVote('yellow')" :disabled="$store.judge.voteLocked"
                    x-text="t('judge.colors.yellow')">
            </button>
        </div>

        <div class="reason-step" x-show="$store.judge.showingReasonStep && !$store.judge.voteLocked">
            <div class="reason-step-header">
                <button class="back-btn" @click="$store.judge.goBackToColorStep()">&#8592; <span x-text="t('judge.back')"></span></button>
                <span class="reason-step-color" :class="$store.judge.selectedVote" x-text="$store.judge.selectedVote ? t('judge.colors.' + $store.judge.selectedVote) : ''"></span>
            </div>
            <div class="reason-list-wrap" :class="{ 'has-overflow-bottom': reasonListOverflows }">
                <div class="reason-list" x-ref="reasonList">
                    <template x-for="reason in getJudgeReasons()" :key="reason.id">
                        <div class="reason-item"
                             :class="{ selected: $store.judge.selectedReason === reason.id }"
                             @click="$store.judge.selectReason(reason.id)"
                             x-text="reason.label">
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="vote-error" role="alert" x-show="$store.judge.voteError" x-text="$store.judge.voteError ? t($store.judge.voteError) : ''"></div>

        <button class="lock-btn cut-corner-sm"
                x-show="$store.judge.canLockIn() && !$store.judge.voteLocked"
                @click="$store.judge.lockVote()"
                x-text="t('judge.lockIn')">
        </button>

        <div class="vote-sending-status" x-show="$store.judge.voteState === 'sending'">
            <span x-text="t('judge.voteSending')"></span> &#8212; <span x-text="$store.judge.selectedVote ? t('judge.colors.' + $store.judge.selectedVote) : ''"></span>
        </div>

        <div class="locked-status" x-show="$store.judge.voteState === 'confirmed'">
            &#10003; <span x-text="t('judge.voteLocked')"></span> &#8212; <span x-text="$store.judge.selectedVote ? t('judge.colors.' + $store.judge.selectedVote) : ''"></span>
        </div>

        <div class="head-section" x-show="$store.session.isHead">
            <div class="head-title-row">
                <div class="head-title" x-text="t('judge.headControls')"></div>
                <div class="judge-connectivity-bar">
                    <span class="connectivity-dot" :class="$store.session.judgeConnected.left ? 'status-connected' : 'status-disconnected'" x-text="t('judge.connectivity.L')"></span>
                    <span class="connectivity-dot" :class="$store.session.judgeConnected.right ? 'status-connected' : 'status-disconnected'" x-text="t('judge.connectivity.R')"></span>
                </div>
            </div>
            <div class="head-grid">
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="startTimer()" x-text="t('judge.startTimer')"></button>
                <button class="btn-blood btn-blood-secondary cut-corner-sm"
                        @click="resetTimer()" x-text="t('judge.resetTimer')"></button>
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="nextLiftGuarded()" x-text="t('judge.nextLift')"></button>
                <button class="btn-blood btn-blood-ghost"
                        @click="confirmEndSession()" x-text="t('judge.endSession')"></button>
            </div>
            <div class="settings-bar">
                <label>
                    <input type="checkbox" data-testid="show-explanations-checkbox" x-model="$store.settings.showExplanations" @change="saveSettings()">
                    <span x-text="t('judge.settings.showReasons')"></span>
                </label>
                <label>
                    <input type="checkbox" data-testid="require-reasons-checkbox" x-model="$store.settings.requireReasons" @change="saveSettings()">
                    <span x-text="t('judge.settings.requireReasons')"></span>
                </label>
                <select data-testid="lift-type-select" x-model="$store.settings.liftType" @change="saveSettings()">
                    <option value="squat" x-text="t('liftTypes.squat')"></option>
                    <option value="bench" x-text="t('liftTypes.bench')"></option>
                    <option value="deadlift" x-text="t('liftTypes.deadlift')"></option>
                </select>
            </div>
        </div>

        <!-- Judge Results Panel -->
        <div class="head-section" x-show="$store.judge.resultsShown">
            <div class="head-title" x-text="t('judge.results')"></div>
            <div class="judge-results-orbs">
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="$store.judge.resultLightClass('left')"></div>
                    <div class="display-orb-card" :class="$store.judge.resultCardClass('left')"></div>
                    <div class="display-orb-reason"
                         x-show="$store.judge.resultReasons.left"
                         x-text="$store.judge.resultReasons.left"
                         :data-reason="$store.judge.resultReasons.left"></div>
                </div>
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="$store.judge.resultLightClass('center')"></div>
                    <div class="display-orb-card" :class="$store.judge.resultCardClass('center')"></div>
                    <div class="display-orb-reason"
                         x-show="$store.judge.resultReasons.center"
                         x-text="$store.judge.resultReasons.center"
                         :data-reason="$store.judge.resultReasons.center"></div>
                </div>
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="$store.judge.resultLightClass('right')"></div>
                    <div class="display-orb-card" :class="$store.judge.resultCardClass('right')"></div>
                    <div class="display-orb-reason"
                         x-show="$store.judge.resultReasons.right"
                         x-text="$store.judge.resultReasons.right"
                         :data-reason="$store.judge.resultReasons.right"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Display Screen: shows sessionName only — sessionCode intentionally omitted (C3).
         Every block (data-layout-block) can be moved, scaled and hidden in the
         layout editor (displayLayoutEditor.js); without a saved layout they
         stay in the default flow layout. -->
    <div class="display-full" data-testid="display-screen" x-data="displayScreen" x-show="$store.nav.screen === 'display'" x-cloak
         :class="[displayContrast && 'display-contrast', activeLayout() && 'display-layout-custom', layoutEditing && 'display-layout-editing']"
         @pointermove="layoutPointerMove($event)"
         @pointerup="layoutPointerUp($event)"
         @pointercancel="layoutPointerUp($event)"
         @lostpointercapture="layoutPointerUp($event)">
        <div class="display-tag">
            <span class="conn-dot" :class="$store.session.connectionStatus"></span>
            <span class="conn-label" x-show="$store.session.serverRestarting" x-text="t('connection.serverRestarting')"></span>
            <span class="code-link" @click="returnToRoleSelection()" x-text="$store.session.isDemo ? 'DEMO' : $store.session.name"></span>
        </div>

        <div class="layout-block layout-block--timer" data-layout-block="timer" x-ref="layout-timer"
             :style="layoutBlockStyle('timer')"
             @pointerdown="layoutPointerDown($event, 'timer', 'move')"
             :class="layoutBlockHidden('timer') && 'layout-hidden'">
            <div class="display-timer-big" :class="$store.timer.expired && 'expired'" x-text="$store.timer.display"></div>
            <div class="layout-frame" x-show="layoutEditing" x-cloak>
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.timer')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-timer"
                            :aria-pressed="layoutBlockHidden('timer') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('timer')"
                            x-text="layoutBlockHidden('timer') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
                <span class="layout-scale-handle" @pointerdown.stop="layoutPointerDown($event, 'timer', 'scale')"></span>
            </div>
        </div>

        <!-- Vote orbs with card and reason below. The cards block (card + reason)
             is not free: it follows the lights, only its gap can change. -->
        <div class="display-lights layout-block" data-layout-block="lights" x-ref="layout-lights"
             :style="layoutBlockStyle('lights')"
             @pointerdown="layoutPointerDown($event, 'lights', 'move')"
             :class="[layoutBlockHidden('lights') && 'layout-hidden-lights', layoutBlockHidden('cards') && 'layout-hidden-cards']"
             x-show="$store.display.phase === 'votes' || $store.display.phase === 'idle'">
            <div class="display-orb-wrap">
                <div class="display-orb" x-ref="layoutOrb" :class="$store.display.lightClass('left')"></div>
                <div class="display-orb-card" :class="$store.display.cardClass('left')"></div>
                <div class="display-orb-reason"
                     x-show="$store.display.showExplanations && $store.display.votes.left && $store.display.votes.left !== 'white' && $store.display.reasons.left"
                     x-text="$store.display.reasons.left"
                     :data-reason="$store.display.reasons.left"></div>
            </div>
            <div class="display-orb-wrap">
                <div class="display-orb" :class="$store.display.lightClass('center')"></div>
                <div class="display-orb-card" :class="$store.display.cardClass('center')"></div>
                <div class="display-orb-reason"
                     x-show="$store.display.showExplanations && $store.display.votes.center && $store.display.votes.center !== 'white' && $store.display.reasons.center"
                     x-text="$store.display.reasons.center"
                     :data-reason="$store.display.reasons.center"></div>
            </div>
            <div class="display-orb-wrap">
                <div class="display-orb" :class="$store.display.lightClass('right')"></div>
                <div class="display-orb-card" :class="$store.display.cardClass('right')"></div>
                <div class="display-orb-reason"
                     x-show="$store.display.showExplanations && $store.display.votes.right && $store.display.votes.right !== 'white' && $store.display.reasons.right"
                     x-text="$store.display.reasons.right"
                     :data-reason="$store.display.reasons.right"></div>
            </div>
            <div class="layout-frame" x-show="layoutEditing" x-cloak>
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.lights')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-lights"
                            :aria-pressed="layoutBlockHidden('lights') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('lights')"
                            x-text="layoutBlockHidden('lights') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
                <span class="layout-scale-handle" @pointerdown.stop="layoutPointerDown($event, 'lights', 'scale')"></span>
            </div>
            <div class="layout-cards-frame" data-layout-block="cards" x-show="layoutEditing" x-cloak
                 @pointerdown.stop="layoutPointerDown($event, 'cards', 'gap')">
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.cards')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-cards"
                            :aria-pressed="layoutBlockHidden('cards') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('cards')"
                            x-text="layoutBlockHidden('cards') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
            </div>
        </div>

        <!-- Verdict and "Waiting…" share one slot; the verdict is always in layout
             (hidden while idle) so the orbs never shift -->
        <div class="display-verdict-inline layout-block" data-layout-block="verdict" x-ref="layout-verdict"
             :style="layoutBlockStyle('verdict')"
             @pointerdown="layoutPointerDown($event, 'verdict', 'move')"
             :class="layoutBlockHidden('verdict') && 'layout-hidden'">
            <div class="verdict-stamp"
                 :style="$store.display.phase !== 'votes' ? 'visibility:hidden' : ''"
                 :class="$store.display.isValidLift() ? 'valid' : 'invalid'"
                 x-text="$store.display.isValidLift() ? t('verdict.goodLift') : t('verdict.noLift')"></div>
            <div class="display-status" x-show="$store.display.phase === 'idle'" x-text="t('display.waiting')"></div>
            <div class="layout-frame" x-show="layoutEditing" x-cloak>
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.verdict')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-verdict"
                            :aria-pressed="layoutBlockHidden('verdict') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('verdict')"
                            x-text="layoutBlockHidden('verdict') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
                <span class="layout-scale-handle" @pointerdown.stop="layoutPointerDown($event, 'verdict', 'scale')"></span>
            </div>
        </div>

        <!-- VPortal lifter (left) and attempt (right); sample text while editing
             without a lifter (cornerAttempt) so they can be placed. -->
        <div class="vportal-corner vportal-corner-left layout-block" data-layout-block="lifter" x-ref="layout-lifter"
             :style="layoutBlockStyle('lifter')"
             @pointerdown="layoutPointerDown($event, 'lifter', 'move')"
             :class="[layoutBlockHidden('lifter') && 'layout-hidden', cornerIsSample() && 'layout-sample']"
             x-show="cornerAttempt()">
            <div class="vportal-corner-name" x-text="cornerAttempt()?.firstName + ' ' + cornerAttempt()?.lastName"></div>
            <div class="vportal-corner-meta">
                <span x-text="cornerAttempt()?.club"></span> ·
                <span x-text="cornerAttempt()?.bodyWeightCategory"></span> ·
                <span x-text="cornerAttempt()?.ageCategory"></span>
            </div>
            <div class="layout-frame" x-show="layoutEditing" x-cloak>
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.lifter') + (cornerIsSample() ? ' · ' + t('displayLayout.sampleTag') : '')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-lifter"
                            :aria-pressed="layoutBlockHidden('lifter') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('lifter')"
                            x-text="layoutBlockHidden('lifter') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
                <span class="layout-scale-handle" @pointerdown.stop="layoutPointerDown($event, 'lifter', 'scale')"></span>
            </div>
        </div>
        <div class="vportal-corner vportal-corner-right layout-block" data-layout-block="attempt" x-ref="layout-attempt"
             :style="layoutBlockStyle('attempt')"
             @pointerdown="layoutPointerDown($event, 'attempt', 'move')"
             :class="[layoutBlockHidden('attempt') && 'layout-hidden', cornerIsSample() && 'layout-sample']"
             x-show="cornerAttempt()">
            <div class="vportal-corner-disc">
                <span x-text="cornerAttempt()?.discipline"></span> ·
                <span x-text="t('vportal.attemptShort') + ' ' + cornerAttempt()?.attempt"></span>
            </div>
            <div class="vportal-corner-weight" x-text="cornerAttempt()?.weight + ' KG'"></div>
            <div class="layout-frame" x-show="layoutEditing" x-cloak>
                <span class="layout-frame-label">
                    <span x-text="t('displayLayout.blocks.attempt') + (cornerIsSample() ? ' · ' + t('displayLayout.sampleTag') : '')"></span>
                    <button class="layout-hide-toggle" data-testid="layout-hide-attempt"
                            :aria-pressed="layoutBlockHidden('attempt') ? 'true' : 'false'"
                            @pointerdown.stop=""
                            @click="toggleLayoutBlockHidden('attempt')"
                            x-text="layoutBlockHidden('attempt') ? t('displayLayout.show') : t('displayLayout.hide')"></button>
                </span>
                <span class="layout-scale-handle" @pointerdown.stop="layoutPointerDown($event, 'attempt', 'scale')"></span>
            </div>
        </div>
        <div class="vportal-disconnected-banner" x-show="$store.vportal.disconnectedReason"
             x-text="t('vportal.disconnectedBanner')"></div>

        <!-- Display settings: gear + panel -->
        <button class="display-settings-gear"
                x-show="!layoutEditing"
                @click.stop="openDisplaySettings()"
                :title="t('displaySettings.openTitle')"
                aria-label="Display settings">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>

        <div class="display-settings-panel"
             x-show="displaySettingsOpen"
             @click.outside="closeDisplaySettings()"
             x-cloak>
            <div class="display-settings-title" x-text="t('displaySettings.title')"></div>
            <button class="display-settings-layout-btn"
                    data-testid="display-layout-edit"
                    @click="startLayoutEdit()"
                    x-text="t('displayLayout.editButton')"></button>
            <button class="display-settings-toggle"
                    data-testid="display-contrast-toggle"
                    :class="displayContrast && 'on'"
                    :aria-pressed="displayContrast ? 'true' : 'false'"
                    @click="toggleDisplayContrast()">
                <span x-text="t('displaySettings.contrastLabel')"></span>
                <span class="display-settings-toggle-state"
                      x-text="displayContrast ? t('displaySettings.on') : t('displaySettings.off')"></span>
            </button>
        </div>

        <!-- Layout editor toolbar: only the buttons here end the edit mode. -->
        <div class="layout-toolbar" data-testid="layout-toolbar" x-show="layoutEditing" x-cloak>
            <div class="layout-toolbar-row">
                <span class="layout-toolbar-title" x-text="t('displayLayout.title')"></span>
                <button class="layout-toolbar-btn layout-toolbar-btn--primary" data-testid="layout-save"
                        @click="saveLayoutEdit()" x-text="t('displayLayout.save')"></button>
                <button class="layout-toolbar-btn" data-testid="layout-cancel"
                        @click="cancelLayoutEdit()" x-text="t('displayLayout.cancel')"></button>
                <button class="layout-toolbar-btn" data-testid="layout-reset"
                        @click="resetLayoutEdit()" x-text="t('displayLayout.reset')"></button>
                <button class="layout-toolbar-btn" data-testid="layout-code-toggle"
                        :aria-expanded="layoutCodeOpen ? 'true' : 'false'"
                        @click="layoutCodeOpen = !layoutCodeOpen" x-text="t('displayLayout.codeButton')"></button>
            </div>
            <div class="layout-toolbar-hint" x-text="t('displayLayout.hint')"></div>
            <div class="layout-code" x-show="layoutCodeOpen">
                <label class="layout-code-label" x-text="t('displayLayout.codeExportLabel')"></label>
                <textarea class="layout-code-field" data-testid="layout-code-export" readonly rows="2"
                          :value="layoutExportCode()"
                          :placeholder="t('displayLayout.codeDefault')"
                          @focus="$event.target.select()"></textarea>
                <label class="layout-code-label" x-text="t('displayLayout.codeImportLabel')"></label>
                <textarea class="layout-code-field" data-testid="layout-code-import" rows="2"
                          x-model="layoutCodeInput"></textarea>
                <div class="layout-code-actions">
                    <button class="layout-toolbar-btn" data-testid="layout-code-apply"
                            @click="applyLayoutCode()" x-text="t('displayLayout.codeApply')"></button>
                    <span class="layout-code-error" data-testid="layout-code-error" x-show="layoutCodeError"
                          x-text="t('displayLayout.codeError')"></span>
                </div>
            </div>
            <div class="layout-code-error" data-testid="layout-save-error" x-show="layoutSaveError"
                 x-text="t('displayLayout.saveError')"></div>
        </div>
    </div>

</body>
</html>
