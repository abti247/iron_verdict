<!DOCTYPE html>
<html lang="en" class="booting">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Verdict — Powerlifting Judging</title>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/boot.css">
    <script type="module" src="/static/js/init.js"></script>
    <script defer src="https://umami-production-ca4a.up.railway.app/script.js" data-website-id="aca70c7a-7634-4ae5-bffa-cc83d8764bd0"></script>
    <link rel="preload" as="script" href="/static/vendor/alpinejs-3.14.1.min.js">
    <script src="/static/vendor/qrcodejs-1.0.0.min.js"></script>
</head>
<body x-data="ironVerdictApp()" :class="{ 'display-mode': role === 'display' && screen === 'display' }">

    <!-- Boot screen: the only thing visible until Alpine has started (see boot.css).
         Plain markup without Alpine or i18n, because it must work without them. -->
    <div class="boot-screen">
        <div class="boot-loading" role="status">
            <div class="boot-spinner"></div>
            <p>Laden … / Loading …</p>
        </div>
        <div class="boot-fallback" role="alert">
            <p>App konnte nicht geladen werden – Seite neu laden</p>
            <p>App could not be loaded – reload the page</p>
            <a class="boot-reload" href="">Neu laden / Reload</a>
        </div>
    </div>

    <!-- Demo Intro Screen -->
    <div class="landing-wrap" data-testid="demo-intro-screen" x-show="screen === 'demo-intro'" x-cloak>
        <div class="landing-panel cut-corner landing-panel--demo">

            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="brand-verdict-sub" x-text="t('demo.guideTitle')"></div>

            <p class="demo-guide-text" x-text="t('demo.intro')"></p>

            <div class="demo-guide-heading" x-text="t('demo.whyTitle')"></div>
            <ul class="demo-guide-list">
                <li><span class="text-em">Athletes</span> — <span x-text="t('demo.athletes')"></span></li>
                <li><span class="text-em">Audience</span> — <span x-text="t('demo.audience')"></span></li>
                <li><span class="text-em">Judges</span> — <span x-text="t('demo.judges')"></span></li>
                <li><span class="text-em">Jury</span> — <span x-text="t('demo.jury')"></span></li>
            </ul>

            <div class="demo-guide-heading" x-text="t('demo.setupTitle')"></div>
            <ol class="demo-guide-list">
                <li x-text="t('demo.setupStep1')"></li>
                <li x-text="t('demo.setupStep2')"></li>
                <li x-text="t('demo.setupStep3')"></li>
            </ol>

            <div class="demo-guide-heading" x-text="t('demo.headControlsTitle')"></div>
            <ul class="demo-guide-list">
                <li x-text="t('demo.showReasonsDesc')"></li>
                <li x-text="t('demo.requireReasonsDesc')"></li>
                <li x-text="t('demo.liftCategoryDesc')"></li>
            </ul>

            <div class="demo-guide-heading" x-text="t('demo.duringTitle')"></div>
            <ol class="demo-guide-list">
                <li x-text="t('demo.duringStep1')"></li>
                <li x-text="t('demo.duringStep2')"></li>
                <li x-text="t('demo.duringStep3')"></li>
                <li x-text="t('demo.duringStep4')"></li>
                <li x-text="t('demo.duringStep5')"></li>
                <li x-text="t('demo.duringStep6')"></li>
            </ol>

            <div x-show="!demoRunning" class="demo-popup-note" x-text="t('demo.popupNote')"></div>

            <div x-show="!demoRunning" class="demo-launch-wrap">
                <button class="btn-blood btn-blood-primary cut-corner-sm" @click="launchDemo()" x-text="t('demo.launchDemo')">
                </button>
            </div>

            <div x-show="demoRunning" class="demo-running-msg" x-text="t('demo.demoRunning')"></div>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="returnToLandingFromDemo()">
                    &larr; <span x-text="t('demo.backToStart')"></span>
                </button>
            </div>

        </div>
    </div>

    <!-- Reconnecting Screen: shown right after a reload while the stored session is restored (reloadRecovery.js) -->
    <div class="landing-wrap" data-testid="reconnecting-screen" x-show="screen === 'reconnecting'" x-cloak>
        <div class="landing-panel cut-corner reconnecting-panel" role="status">
            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="boot-spinner"></div>
            <div class="reconnecting-text">
                <span x-text="t('reconnecting.connecting')"></span>
                <span class="reconnecting-code" x-text="sessionCode"></span>
            </div>
            <button class="btn-blood btn-blood-ghost" @click="cancelReconnect()"
                    x-text="t('reconnecting.cancel')"></button>
        </div>
    </div>

    <!-- Landing Screen -->
    <div class="landing-wrap" data-testid="landing-screen" x-show="screen === 'landing'" x-cloak>
        <div class="landing-panel cut-corner">
            <div class="brand-iron chrome-text">Iron Verdict</div>
            <div class="brand-verdict-sub" x-text="t('landing.subtitle')"></div>

            <div class="form-stack">
                <input class="chrome-input" :placeholder="t('landing.placeholder.sessionName')"
                       data-testid="session-name-input" x-model="newSessionName" @keyup.enter="createSession()">
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="createSession()" :disabled="!newSessionName.trim()"
                        x-text="t('landing.createSession')">
                </button>

                <div class="slash-divider" x-text="t('landing.or')"></div>

                <input class="chrome-input" :placeholder="t('landing.placeholder.sessionCode')"
                       data-testid="join-code-input" x-model="joinCode"
                       @input="joinError = ''"
                       @keyup.enter="joinExistingSession()">
                <button class="btn-blood btn-blood-secondary cut-corner-sm"
                        @click="joinExistingSession()"
                        :disabled="joinCode.trim().length !== 8 || joinChecking"
                        x-text="joinChecking ? t('landing.checking') : t('landing.joinSession')">
                </button>
                <div class="join-error" x-show="joinError" x-cloak x-text="joinError"></div>
            </div>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="startDemo()" x-text="t('landing.startDemo')">
                </button>
            </div>

            <div class="btn-row--sm">
                <button class="btn-blood btn-blood-ghost" @click="goToContact()" x-text="t('landing.contact')">
                </button>
            </div>

            <div class="app-version">
                __APP_VERSION__
            </div>

            <div class="lang-footer">
                <span class="lang-globe">&#127760;</span>
                <template x-for="(lang, idx) in ['en', 'de']" :key="lang">
                    <span>
                        <span x-show="idx > 0" class="lang-sep">|</span>
                        <span class="lang-option"
                              :class="{ 'lang-active': getLanguage() === lang }"
                              @click="setLanguage(lang)"
                              x-text="t('language.' + lang)"></span>
                    </span>
                </template>
            </div>

            <div class="privacy-footer">
                <span class="privacy-link" @click="navigateTo('privacy')" x-text="t('privacy.link')"></span>
            </div>
        </div>
    </div>

    <!-- Contact Screen -->
    <div class="landing-wrap" data-testid="contact-screen" x-show="screen === 'contact'" x-cloak>
        <div class="landing-panel cut-corner">
            <div class="brand-iron chrome-text" x-text="t('contact.title')"></div>
            <div class="brand-verdict-sub">Iron Verdict</div>

            <form class="form-stack" @submit.prevent="submitContact()" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="2e92ea27-be19-4996-83c9-0b33fcb63419">
                <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                <div x-show="contactStatus !== 'success'">
                    <div class="form-stack form-stack--no-top">
                        <input class="chrome-input" type="text" name="name" :placeholder="t('contact.name')"
                               x-model="contactName" required>
                        <input class="chrome-input" type="email" name="email" :placeholder="t('contact.email')"
                               x-model="contactEmail">
                        <textarea class="chrome-textarea" name="message" :placeholder="t('contact.message')"
                                  x-model="contactMessage" required></textarea>

                        <button class="btn-blood btn-blood-primary cut-corner-sm"
                                type="submit"
                                :disabled="contactStatus === 'loading' || !contactName.trim() || !contactMessage.trim()"
                                x-text="contactStatus === 'loading' ? t('contact.sending') : t('contact.send')">
                        </button>

                        <div x-show="contactStatus === 'error'" class="contact-error" x-text="t('contact.error')">
                        </div>
                    </div>
                </div>

                <div x-show="contactStatus === 'success'" class="contact-success">
                    <span x-text="t('contact.sent')"></span>
                    <div class="contact-success-sub" x-text="t('contact.sentSub')">
                    </div>
                </div>
            </form>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="navigateTo('landing')">
                    &larr; <span x-text="t('contact.back')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Privacy Screen -->
    <div class="landing-wrap" data-testid="privacy-screen" x-show="screen === 'privacy'" x-cloak>
        <div class="landing-panel cut-corner">
            <div class="brand-iron chrome-text" x-text="t('privacy.title')"></div>
            <div class="brand-verdict-sub">Iron Verdict</div>

            <ul class="privacy-list">
                <li x-text="t('privacy.serverLogs')"></li>
                <li x-text="t('privacy.session')"></li>
                <li x-text="t('privacy.language')"></li>
                <li x-text="t('privacy.analytics')"></li>
                <li x-text="t('privacy.cookies')"></li>
            </ul>

            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="navigateTo('landing')">
                    &larr; <span x-text="t('privacy.back')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Role Selection Screen -->
    <div class="role-wrap" data-testid="role-select-screen" x-show="screen === 'role-select'" x-cloak>
        <div class="role-panel cut-corner">
            <div class="role-heading chrome-text" x-text="t('roles.heading')"></div>
            <div class="session-tag">
                <span x-text="t('roles.session')"></span> <span class="code" x-text="sessionCode"></span>
            </div>

            <div class="role-qr-wrap">
                <div id="qrcode"></div>
            </div>

            <div class="lang-toggle">
                <template x-for="lang in ['en', 'de']" :key="lang">
                    <button class="lang-toggle-btn"
                            :class="{ active: getLanguage() === lang }"
                            @click="setLanguage(lang)"
                            x-text="lang.toUpperCase()"></button>
                </template>
            </div>

            <div class="role-notice" role="alert" x-show="roleTakenOver" x-cloak x-text="roleTakenOverNotice()"></div>

            <div class="role-grid">
                <button class="role-btn cut-corner-sm" @click="joinSession('left_judge')" x-text="t('roles.left')">
                </button>
                <button class="role-btn cut-corner-sm" @click="joinSession('center_judge')" x-text="t('roles.chiefReferee')" style="white-space: pre-line">
                </button>
                <button class="role-btn cut-corner-sm" @click="joinSession('right_judge')" x-text="t('roles.right')">
                </button>
                <button class="role-btn role-display-btn cut-corner-sm" @click="joinSession('display')" x-text="t('roles.display')">
                </button>
            </div>
            <template x-if="sessionKind === 'vportal'">
                <div class="vportal-connect-wrap">
                    <button class="vportal-connect-btn cut-corner-sm"
                            :class="{ 'connected': $store.vportal.connected }"
                            @click="$store.vportal.openModal()"
                            x-text="$store.vportal.connected
                                ? (t('vportal.connectedTo') + ' ' + $store.vportal.federationLabel + ' · ' + ($store.vportal.stageName || ''))
                                : t('vportal.connectButton')"></button>
                </div>
            </template>
            <div class="btn-row">
                <button class="btn-blood btn-blood-ghost" @click="returnToLanding()">
                    &larr; <span x-text="t('roles.backToStart')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- VPortal Connect Modal -->
    <div class="vportal-modal-backdrop" data-testid="vportal-modal" x-show="$store.vportal.modalOpen" x-cloak @click.self="$store.vportal.modalOpen = false">
        <div class="vportal-modal cut-corner" @click.stop>
            <div class="vportal-modal-title chrome-text" x-text="t('vportal.modalTitle')"></div>

            <!-- Step 1: Federation -->
            <div class="vportal-step-federation" x-show="$store.vportal.modalStep === 'federation'">
                <label class="vportal-label" x-text="t('vportal.federationLabel')"></label>
                <select class="chrome-input" data-testid="vportal-federation-select" x-model="$store.vportal.federation">
                    <option value="BVDK" x-text="t('vportal.federationBvdk')"></option>
                    <option value="OEVK" x-text="t('vportal.federationOevk')"></option>
                    <template x-if="$store.vportal.stagingAvailable">
                        <option value="BVDK_STAGING" x-text="t('vportal.federationBvdkStaging')"></option>
                    </template>
                </select>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.modalStep = 'credentials'">→</button>
                </div>
            </div>

            <!-- Step 2: Credentials -->
            <div class="vportal-step-credentials" x-show="$store.vportal.modalStep === 'credentials'">
                <label class="vportal-label" x-text="t('vportal.usernameLabel')"></label>
                <input class="chrome-input" type="text" data-testid="vportal-identity-input" x-model="$store.vportal.identity" autocomplete="username">
                <label class="vportal-label" x-text="t('vportal.passwordLabel')"></label>
                <input class="chrome-input" type="password" data-testid="vportal-credential-input" x-model="$store.vportal.credential" autocomplete="current-password">
                <div class="vportal-error" x-show="$store.vportal.loginError" x-text="$store.vportal.loginError"></div>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalStep = 'federation'">←</button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.doLogin(sessionCode)" :disabled="!$store.vportal.identity || !$store.vportal.credential" x-text="t('vportal.loginButton')"></button>
                </div>
            </div>

            <!-- Step 3: Stage picker -->
            <div class="vportal-step-stage" x-show="$store.vportal.modalStep === 'stage'">
                <label class="vportal-label" x-text="t('vportal.stageLabel')"></label>
                <select class="chrome-input" data-testid="vportal-stage-select" x-model="$store.vportal.selectedStage" :disabled="$store.vportal.stages.length === 0">
                    <template x-for="stage in $store.vportal.stages" :key="stage.id">
                        <option :value="stage.id" x-text="stage.name"></option>
                    </template>
                </select>
                <div class="vportal-loading" x-show="$store.vportal.stages.length === 0 && !$store.vportal.stageError" x-text="t('vportal.loadingStages')"></div>
                <div class="vportal-error" x-show="$store.vportal.stageError" x-text="$store.vportal.stageError"></div>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary vportal-next-btn" @click="$store.vportal.confirmStage(sessionCode)" :disabled="!$store.vportal.selectedStage" x-text="t('vportal.stageSelectButton')"></button>
                </div>
            </div>

            <!-- Step 4: Connected (when re-opened on already-connected session) -->
            <div class="vportal-step-connected" x-show="$store.vportal.modalStep === 'connected'">
                <p>
                    <span x-text="t('vportal.connectedTo')"></span>
                    <strong x-text="$store.vportal.federationLabel"></strong>
                    · <strong x-text="$store.vportal.stageName"></strong>
                </p>
                <div class="vportal-btn-row">
                    <button class="btn-blood btn-blood-ghost" @click="$store.vportal.modalOpen = false" x-text="t('vportal.cancelButton')"></button>
                    <button class="btn-blood btn-blood-primary" @click="$store.vportal.disconnect(sessionCode)" x-text="t('vportal.disconnectButton')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Judge Screen -->
    <div class="judge-wrap" data-testid="judge-screen" x-show="screen === 'judge'" x-cloak>
        <div class="judge-bar">
            <div class="judge-role-label" x-text="getRoleDisplayName()"></div>
            <div class="judge-timer" :class="timerExpired && 'expired'" x-text="timerDisplay"></div>
            <div class="judge-code">
                <span class="conn-dot" :class="connectionStatus"></span>
                <span class="conn-label" x-show="serverRestarting" x-text="t('connection.serverRestarting')"></span>
                <span class="code-link" @click="returnToRoleSelection()" x-text="sessionCode"></span>
            </div>
        </div>

        <div class="vote-grid" x-show="!showingReasonStep" :style="voteLocked ? 'opacity:0.35;pointer-events:none' : ''">
            <button class="vote-btn vote-white cut-corner-sm"
                    :class="selectedVote === 'white' && 'selected'"
                    @click="selectVote('white')" :disabled="voteLocked"
                    x-text="t('judge.colors.white')">
            </button>
            <button class="vote-btn vote-red cut-corner-sm"
                    :class="selectedVote === 'red' && 'selected'"
                    @click="selectVote('red')" :disabled="voteLocked"
                    x-text="t('judge.colors.red')">
            </button>
            <button class="vote-btn vote-blue cut-corner-sm"
                    :class="selectedVote === 'blue' && 'selected'"
                    @click="selectVote('blue')" :disabled="voteLocked"
                    x-text="t('judge.colors.blue')">
            </button>
            <button class="vote-btn vote-yellow cut-corner-sm"
                    :class="selectedVote === 'yellow' && 'selected'"
                    @click="selectVote('yellow')" :disabled="voteLocked"
                    x-text="t('judge.colors.yellow')">
            </button>
        </div>

        <div class="reason-step" x-show="showingReasonStep && !voteLocked">
            <div class="reason-step-header">
                <button class="back-btn" @click="goBackToColorStep()">&#8592; <span x-text="t('judge.back')"></span></button>
                <span class="reason-step-color" :class="selectedVote" x-text="selectedVote ? t('judge.colors.' + selectedVote) : ''"></span>
            </div>
            <div class="reason-list-wrap" :class="{ 'has-overflow-bottom': reasonListOverflows }">
                <div class="reason-list" x-ref="reasonList">
                    <template x-for="reason in getJudgeReasons()" :key="reason.id">
                        <div class="reason-item"
                             :class="{ selected: selectedReason === reason.id }"
                             @click="selectReason(reason.id)"
                             x-text="reason.label">
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="vote-error" role="alert" x-show="voteError" x-text="voteError ? t(voteError) : ''"></div>

        <button class="lock-btn cut-corner-sm"
                x-show="canLockIn() && !voteLocked"
                @click="lockVote()"
                x-text="t('judge.lockIn')">
        </button>

        <div class="vote-sending-status" x-show="voteState === 'sending'">
            <span x-text="t('judge.voteSending')"></span> &#8212; <span x-text="selectedVote ? t('judge.colors.' + selectedVote) : ''"></span>
        </div>

        <div class="locked-status" x-show="voteState === 'confirmed'">
            &#10003; <span x-text="t('judge.voteLocked')"></span> &#8212; <span x-text="selectedVote ? t('judge.colors.' + selectedVote) : ''"></span>
        </div>

        <div class="head-section" x-show="isHead">
            <div class="head-title-row">
                <div class="head-title" x-text="t('judge.headControls')"></div>
                <div class="judge-connectivity-bar">
                    <span class="connectivity-dot" :class="judgeConnected.left ? 'status-connected' : 'status-disconnected'" x-text="t('judge.connectivity.L')"></span>
                    <span class="connectivity-dot" :class="judgeConnected.right ? 'status-connected' : 'status-disconnected'" x-text="t('judge.connectivity.R')"></span>
                </div>
            </div>
            <div class="head-grid">
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="startTimer()" x-text="t('judge.startTimer')"></button>
                <button class="btn-blood btn-blood-secondary cut-corner-sm"
                        @click="resetTimer()" x-text="t('judge.resetTimer')"></button>
                <button class="btn-blood btn-blood-primary cut-corner-sm"
                        @click="nextLiftGuarded()" x-text="t('judge.nextLift')"></button>
                <button class="btn-blood btn-blood-ghost"
                        @click="confirmEndSession()" x-text="t('judge.endSession')"></button>
            </div>
            <div class="settings-bar">
                <label>
                    <input type="checkbox" data-testid="show-explanations-checkbox" x-model="showExplanations" @change="saveSettings()">
                    <span x-text="t('judge.settings.showReasons')"></span>
                </label>
                <label>
                    <input type="checkbox" data-testid="require-reasons-checkbox" x-model="requireReasons" @change="saveSettings()">
                    <span x-text="t('judge.settings.requireReasons')"></span>
                </label>
                <select data-testid="lift-type-select" x-model="liftType" @change="saveSettings()">
                    <option value="squat" x-text="t('liftTypes.squat')"></option>
                    <option value="bench" x-text="t('liftTypes.bench')"></option>
                    <option value="deadlift" x-text="t('liftTypes.deadlift')"></option>
                </select>
            </div>
        </div>

        <!-- Judge Results Panel -->
        <div class="head-section" x-show="resultsShown">
            <div class="head-title" x-text="t('judge.results')"></div>
            <div class="judge-results-orbs">
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="judgeResultVotes.left"></div>
                    <div class="display-orb-reason"
                         x-show="judgeResultReasons.left"
                         x-text="judgeResultReasons.left"></div>
                </div>
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="judgeResultVotes.center"></div>
                    <div class="display-orb-reason"
                         x-show="judgeResultReasons.center"
                         x-text="judgeResultReasons.center"></div>
                </div>
                <div class="judge-result-orb-wrap">
                    <div class="display-orb display-orb--sm" :class="judgeResultVotes.right"></div>
                    <div class="display-orb-reason"
                         x-show="judgeResultReasons.right"
                         x-text="judgeResultReasons.right"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Display Screen: shows sessionName only — sessionCode intentionally omitted (C3) -->
    <div class="display-full" data-testid="display-screen" x-show="screen === 'display'" x-cloak
         :style="`--display-zoom: ${displayZoom || 1}`">
        <div class="display-tag">
            <span class="conn-dot" :class="connectionStatus"></span>
            <span class="conn-label" x-show="serverRestarting" x-text="t('connection.serverRestarting')"></span>
            <span class="code-link" x-show="!isDemo" @click="returnToRoleSelection()" x-text="sessionName"></span>
            <span x-show="isDemo">DEMO</span>
        </div>

        <div class="display-timer-big" :class="timerExpired && 'expired'" x-text="timerDisplay"></div>

        <!-- Vote orbs with reasons -->
        <div class="display-lights" x-show="displayPhase === 'votes' || displayPhase === 'idle'">
            <div class="display-orb-wrap">
                <div class="display-orb" :class="displayVotes.left"></div>
                <div class="display-orb-reason"
                     x-show="displayShowExplanations && displayVotes.left && displayVotes.left !== 'white' && displayReasons.left"
                     x-text="displayReasons.left"></div>
            </div>
            <div class="display-orb-wrap">
                <div class="display-orb" :class="displayVotes.center"></div>
                <div class="display-orb-reason"
                     x-show="displayShowExplanations && displayVotes.center && displayVotes.center !== 'white' && displayReasons.center"
                     x-text="displayReasons.center"></div>
            </div>
            <div class="display-orb-wrap">
                <div class="display-orb" :class="displayVotes.right"></div>
                <div class="display-orb-reason"
                     x-show="displayShowExplanations && displayVotes.right && displayVotes.right !== 'white' && displayReasons.right"
                     x-text="displayReasons.right"></div>
            </div>
        </div>

        <!-- Verdict shown alongside orbs; always in layout to prevent orbs from shifting -->
        <div class="display-verdict-inline" :style="displayPhase !== 'votes' ? 'visibility:hidden' : ''">
            <div class="verdict-stamp"
                 :class="isValidLift() ? 'valid' : 'invalid'"
                 x-text="isValidLift() ? t('verdict.goodLift') : t('verdict.noLift')"></div>
        </div>

        <div class="display-status" x-text="displayStatus || (displayPhase === 'idle' ? t('display.waiting') : '')"></div>

        <div class="vportal-corner vportal-corner-left" x-show="$store.vportal.displayAttempt">
            <div class="vportal-corner-name" x-text="$store.vportal.displayAttempt?.firstName + ' ' + $store.vportal.displayAttempt?.lastName"></div>
            <div class="vportal-corner-meta">
                <span x-text="$store.vportal.displayAttempt?.club"></span> ·
                <span x-text="$store.vportal.displayAttempt?.bodyWeightCategory"></span> ·
                <span x-text="$store.vportal.displayAttempt?.ageCategory"></span>
            </div>
        </div>
        <div class="vportal-corner vportal-corner-right" x-show="$store.vportal.displayAttempt">
            <div class="vportal-corner-disc">
                <span x-text="$store.vportal.displayAttempt?.discipline"></span> ·
                <span x-text="t('vportal.attemptShort') + ' ' + $store.vportal.displayAttempt?.attempt"></span>
            </div>
            <div class="vportal-corner-weight" x-text="$store.vportal.displayAttempt?.weight + ' KG'"></div>
        </div>
        <div class="vportal-disconnected-banner" x-show="$store.vportal.disconnectedReason"
             x-text="t('vportal.disconnectedBanner')"></div>

        <!-- Display settings: gear + panel -->
        <button class="display-settings-gear"
                @click.stop="openDisplaySettings()"
                :title="t('displaySettings.openTitle')"
                aria-label="Display settings">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>

        <div class="display-settings-panel"
             x-show="displaySettingsOpen"
             @click.outside="closeDisplaySettings()"
             x-cloak>
            <div class="display-settings-title" x-text="t('displaySettings.title')"></div>
            <label class="display-settings-label">
                <span x-text="t('displaySettings.sliderLabel')"></span>
                <span class="display-settings-readout" x-text="(displayZoom).toFixed(2) + '×'"></span>
            </label>
            <input class="display-settings-slider"
                   type="range"
                   min="0.7" max="1.5" step="0.05"
                   :value="displayZoom"
                   @input="onDisplayZoomInput($event)">
            <div class="display-settings-actions">
                <button class="display-settings-reset"
                        @click="resetDisplayZoom()"
                        x-text="t('displaySettings.resetButton')"></button>
            </div>
        </div>
    </div>

</body>
</html>
